<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synthetic Workflow Portal</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 24px; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 6px; }
    textarea { min-height: 90px; }
    button { margin-top: 20px; padding: 10px 18px; cursor: pointer; }
    #result { margin-top: 18px; font-weight: 700; }
    .meta { color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Synthetic Workflow Portal</h1>
    <p class="meta">Local fictional application created only for portfolio demonstration.</p>

    <p><strong>Record:</strong> <span id="record-id"></span></p>

    <label for="owner">Owner</label>
    <input id="owner" type="text" />

    <label for="decision">Decision</label>
    <select id="decision">
      <option value="APPROVE">APPROVE</option>
      <option value="REJECT">REJECT</option>
      <option value="REVIEW">REVIEW</option>
    </select>

    <label for="comment">Comment</label>
    <textarea id="comment"></textarea>

    <button id="submit-action" type="button">Submit Action</button>
    <div id="result"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const recordId = params.get("record") || "UNKNOWN";
    const failureMode = params.get("failure_mode") || "none";
    const attempt = Number(params.get("attempt") || "1");

    document.getElementById("record-id").textContent = recordId;

    document.getElementById("submit-action").addEventListener("click", () => {
      const result = document.getElementById("result");

      if (failureMode === "permanent") {
        result.textContent = "ERROR: permanent synthetic validation failure";
        return;
      }

      if (failureMode === "transient" && attempt === 1) {
        result.textContent = "ERROR: temporary synthetic service failure";
        return;
      }

      result.textContent = "SUCCESS: synthetic workflow completed";
    });
  </script>
</body>
</html>
